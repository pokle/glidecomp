name: Deploy

# One workflow for every branch. Test + E2E + build + Pages preview deploy +
# smoke tests run identically on every push; the master-only production steps
# (real Worker deploys, apex D1 migrations, the apex-routed scores check) are
# gated on `github.ref_name == 'master'`. Keeping a single definition means the
# branch-preview and production paths can never drift — the drift that let the
# git-sha smoke check silently rot on master while it was green on branches.
#
# Job graph: `test`, the three `e2e` shards and `e2e-ssr` all start together;
# `deploy` waits on `test`. Making E2E queue behind `test` would add the whole
# test job to every build's wall clock while consuming nothing it produced —
# each builds its own stack from the checkout.
#
# E2E was the long pole by a wide margin until it was sharded: on run
# 32355085390 the job ran 11m04s while every other job finished inside 5
# minutes, so the build's wall clock WAS the E2E job. It is now split three
# ways by measured duration (e2e/fixtures/shards.ts), which puts the worst
# shard at roughly 5 minutes.
#
# That is about the floor worth chasing. The remaining critical path is
# `test` (~2m23s) → `deploy` (~2m21s) ≈ 4m49s, so a fourth shard would buy
# almost nothing while adding another runner's ~1m51s of setup to the bill.
# Re-measure before adding one.
# The trade is that a commit failing unit tests still burns E2E minutes; the
# deploy is still gated, so nothing reaches Cloudflare on a red suite.
on:
  push:
    branches:
      - '**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Two attempts, because the first one is a download from GitHub's release
      # CDN and that has answered 500 three times in a row (run 30809701372, 33s
      # and the job was over). The action retries internally on a 15s/17s
      # schedule; a fourth try a moment later is what actually got past it.
      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        continue-on-error: true

      - name: Setup Bun (retry)
        if: steps.setup-bun.outcome == 'failure'
        uses: oven-sh/setup-bun@v2

      # Insurance, not speed: a warm install is ~3s, but one run in ten
      # sampled took 180s on a cold fetch and finished at 9m17s. restore-keys
      # means a lockfile bump still reuses most of the previous cache.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No separate type-check step: `test:all` → `test` already ends in
      # `typecheck:all`, and it gets there 3s in (after the engine's bun-test
      # sweep), so a dedicated step bought no earlier failure — only a second
      # full `tsc` run.
      - name: Run tests
        run: bun run test:all

      # The scoring changelog is the transparency record for a pilot whose
      # points moved, so a branch that changes scoring behaviour has to add a
      # note. This lives here rather than in a bun test because it compares
      # against the MERGE BASE: keeping no baseline in the tree is what leaves
      # parallel engine branches nothing to conflict over. The checkout is
      # shallow, so master is fetched first; the check skips itself rather
      # than failing if the merge base is still out of reach.
      - name: Check for a scoring change note
        run: |
          git fetch --no-tags --depth=100 origin master || true
          bun run check:scoring-note

  # Sharded across three runners. See e2e/fixtures/shards.ts for the groups and
  # why they are explicit lists rather than Playwright's `--shard=i/N` (that
  # balances by test COUNT, and this suite's durations are far from uniform —
  # a naive 4-way split put the three heaviest specs on one runner and left it
  # at 292s while another finished in 69s).
  #
  # Each shard builds its own stack and its own local D1, so the shared mutable
  # fixtures that force `workers: 1` inside a run cannot collide BETWEEN shards.
  # That isolation is what makes this safe without touching the fixtures.
  #
  # fail-fast is off: one shard going red should not cancel the other two, or a
  # single failure hides whatever else broke and every fix takes another full
  # round trip.
  e2e:
    name: E2E Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [maps-and-analysis, organiser, public-and-pilot]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        continue-on-error: true

      # See the note on the Test job — the release CDN 500s often enough to
      # cost a run, and the retry is the whole fix.
      - name: Setup Bun (retry)
        if: steps.setup-bun.outcome == 'failure'
        uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The browser binaries cache cleanly under ~/.cache/ms-playwright (~9s of
      # download on a miss, near-free on a hit). Its OS dependencies do NOT:
      # `install-deps` apt-installs them into /usr/lib and /usr/share, which
      # actions/cache cannot restore, so that step re-ran every job forever —
      # 11s, 12s, 19s and 26s on the four jobs of run 32481474298, the variance
      # as annoying as the cost.
      #
      # It is gone now, because ubuntu-latest already ships what headless
      # Chromium needs. That is a claim about the RUNNER IMAGE, not about
      # Playwright, so it can be falsified by a GitHub image update rather than
      # by anything in this repo — but it fails loudly if it ever is: Chromium
      # refuses to launch and every spec in the job errors on browser startup.
      # There is no quiet-wrong version of this, which is what makes dropping
      # it safe to try.
      #
      # `--with-deps` is off the install below for the same reason (that flag
      # IS install-deps). The suite does no visual diffing, so a font the image
      # lacks cannot silently shift a screenshot past a threshold; the only
      # assertions near text are on its content, not its rasterisation.
      #
      # Running the whole matrix inside mcr.microsoft.com/playwright was the
      # other way to skip apt, and it measured WORSE: the image pull cost a
      # flat 36s against the ~23s of cache-plus-apt it replaced, because
      # GitHub-hosted runners are fresh VMs with no layer cache. See #657.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Create auth .dev.vars
        run: |
          cat > web/workers/auth-api/.dev.vars << 'EOF'
          GOOGLE_CLIENT_ID=dummy-for-ci
          GOOGLE_CLIENT_SECRET=dummy-for-ci
          BETTER_AUTH_SECRET=ci-only-not-for-production-J7Oz93uJjYD6f2bkvkO220QquD7a1jUOaSDrrWsDUOvp
          BETTER_AUTH_URL=http://localhost:3000
          EOF

      # Probe wrangler & d1 migrations directly (no `bun run --filter`)
      # so any crash surfaces real stderr instead of being swallowed by
      # bun's prefixed-output buffer.
      - name: Probe auth-api startup
        run: |
          cd web/workers/auth-api
          bunx wrangler --version
          CI=true bunx wrangler d1 migrations apply taskscore-auth --local --persist-to ../../.wrangler/state

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          # playwright.config.ts narrows both projects to this shard's specs,
          # and drops a project the shard leaves empty. An unrecognised name
          # throws rather than running everything, so a typo here fails the job
          # instead of quietly tripling the bill on a green run.
          E2E_SHARD: ${{ matrix.shard }}

      - name: Dump wrangler logs on failure
        if: failure()
        run: |
          echo "=== ~/.config/.wrangler/logs ==="
          ls -la ~/.config/.wrangler/logs/ 2>/dev/null || echo "(no logs dir)"
          for f in ~/.config/.wrangler/logs/*.log; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            cat "$f"
          done

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per shard: upload-artifact v4 refuses a duplicate name, so three
          # shards sharing "playwright-report" would fail whichever two
          # finished last — on a green run. Same reason the SSR job has its own
          # name below.
          name: playwright-report-${{ matrix.shard }}
          # test-results/ holds the per-failure trace.zip files referenced by
          # playwright.config.ts's `trace: "retain-on-failure"`. They're
          # separate from the HTML report, so include both paths.
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The OTHER e2e suite: e2e/ssr.spec.ts against the BUILT output served by the
  # real Pages runtime (wrangler pages dev + the SSR Function), which is the
  # only place server rendering happens at all — the dev server the `e2e` job
  # drives serves the SPA shell with no SSR, so nothing in that job can fail
  # when a public comp page stops server-rendering.
  #
  # Its own job rather than a second step on `e2e`: it builds the frontend
  # twice over (SPA + SSR bundle) before it can serve anything, so bolting it
  # on would add that build to the long pole every run. Parallel it costs
  # nothing extra in wall clock, and its report uploads under its own name.
  e2e-ssr:
    name: E2E Tests (SSR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        continue-on-error: true

      # See the note on the Test job — the release CDN 500s often enough to
      # cost a run, and the retry is the whole fix.
      - name: Setup Bun (retry)
        if: steps.setup-bun.outcome == 'failure'
        uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No apt step here either — see the note on the E2E job above.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      # BETTER_AUTH_URL is :3100 here, not :3000 — this suite's frontend is
      # `wrangler pages dev` on the SSR port. Nothing in ssr.spec.ts signs in
      # today, but a mismatched origin is exactly how a signed-in assertion
      # added later would fail with INVALID_ORIGIN and no clue why.
      #
      # No VITE_MAPBOX_TOKEN, deliberately. The SPA e2e job needs a fake one
      # because e2e/fixtures/mapbox.ts serves every Mapbox response from
      # recordings; this suite intercepts nothing, so a baked fake token would
      # buy real 401s and a slower `networkidle` instead of mapbox-gl bailing
      # out quietly.
      - name: Create auth .dev.vars
        run: |
          cat > web/workers/auth-api/.dev.vars << 'EOF'
          GOOGLE_CLIENT_ID=dummy-for-ci
          GOOGLE_CLIENT_SECRET=dummy-for-ci
          BETTER_AUTH_SECRET=ci-only-not-for-production-J7Oz93uJjYD6f2bkvkO220QquD7a1jUOaSDrrWsDUOvp
          BETTER_AUTH_URL=http://localhost:3100
          EOF

      # Same reason as the E2E job: run wrangler directly so a crash shows its
      # own stderr instead of bun's buffered, prefixed output.
      - name: Probe auth-api startup
        run: |
          cd web/workers/auth-api
          bunx wrangler --version
          CI=true bunx wrangler d1 migrations apply taskscore-auth --local --persist-to ../../.wrangler/state

      - name: Run SSR E2E tests
        run: bun run test:e2e:ssr

      - name: Dump wrangler logs on failure
        if: failure()
        run: |
          echo "=== ~/.config/.wrangler/logs ==="
          ls -la ~/.config/.wrangler/logs/ 2>/dev/null || echo "(no logs dir)"
          for f in ~/.config/.wrangler/logs/*.log; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            cat "$f"
          done

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # A distinct name: upload-artifact v4 refuses a duplicate, so sharing
          # "playwright-report" with the E2E job would fail whichever finished
          # second — on a green run.
          name: playwright-report-ssr
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        continue-on-error: true

      # See the note on the Test job — the release CDN 500s often enough to
      # cost a run, and the retry is the whole fix.
      - name: Setup Bun (retry)
        if: steps.setup-bun.outcome == 'failure'
        uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate required secrets
        run: |
          if [ -z "$VITE_MAPBOX_TOKEN" ]; then
            echo "Error: VITE_MAPBOX_TOKEN is not set"
            exit 1
          fi
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: Build
        run: bun run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      # ── Production-only: deploy the Workers before Pages (Pages service
      # bindings require the Workers to exist). Branch previews reuse the
      # already-deployed production Workers via their service bindings. ──
      - name: Deploy AirScore API Worker
        if: github.ref_name == 'master'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/workers/airscore-api
          command: deploy

      - name: Apply D1 Migrations
        if: github.ref_name == 'master'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/workers/auth-api
          command: d1 migrations apply taskscore-auth --remote

      - name: Deploy Auth API Worker
        if: github.ref_name == 'master'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/workers/auth-api
          command: deploy

      - name: Deploy Competition API Worker
        if: github.ref_name == 'master'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/workers/competition-api
          command: deploy

      # Pages deploy for every branch. `--branch=master` promotes to production
      # (glidecomp.com); any other branch gets its preview alias.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch=${{ github.ref_name }}

      - name: Output preview URL (and comment on the PR)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIEW_URL="${{ steps.deploy.outputs.deployment-url }}"

          echo "## Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "URL: ${PREVIEW_URL}" >> $GITHUB_STEP_SUMMARY

          # Post the preview URL as a PR comment (if a PR exists for this branch).
          # On master there is no PR, so this is a no-op.
          PR_NUMBER=$(gh pr view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json number --jq '.number' 2>/dev/null || true)
          if [ -n "$PR_NUMBER" ]; then
            COMMENT_MARKER="<!-- branch-deploy-preview -->"
            COMMENT_BODY="${COMMENT_MARKER}
          **Preview Deployment**
          ${PREVIEW_URL}
          _Commit: ${{ github.sha }}_"

            # Delete previous preview comment if it exists, then post a new one
            EXISTING_COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.body | startswith(\"${COMMENT_MARKER}\")) | .id" 2>/dev/null | head -1 || true)
            if [ -n "$EXISTING_COMMENT_ID" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/issues/comments/${EXISTING_COMMENT_ID}" 2>/dev/null || true
            fi

            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$COMMENT_BODY"
          fi

      # Single shared smoke suite (web/scripts/smoke-test.sh) runs against this
      # deployment for BOTH branch previews and production, so any change to the
      # smoke logic is validated on the PR's preview before it can reach master.
      # The stale-first scores check targets the apex-routed competition worker
      # (only freshly deployed on master), so it's added only for the master run.
      - name: Smoke test — deployment serves the app correctly
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          EXPECTED_SHA: ${{ github.sha }}
          IS_PROD: ${{ github.ref_name == 'master' }}
        run: |
          args=("$DEPLOY_URL" "$EXPECTED_SHA")
          if [ "$IS_PROD" = "true" ]; then
            args+=(--scores-api https://glidecomp.com)
          fi
          bash web/scripts/smoke-test.sh "${args[@]}"
