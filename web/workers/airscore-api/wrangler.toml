name = "airscore-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Reached only through glidecomp.com (the [[routes]] below) or a service
# binding, never at a workers.dev or per-version preview URL. Stated rather
# than left to wrangler, which switches workers.dev off only while [[routes]]
# exist: airscore-api's /internal/ endpoints have no authentication of their
# own, so their privacy must not hang on a default.
workers_dev = false
preview_urls = false

# KV namespace for caching - create with:
# bunx wrangler kv namespace create AIRSCORE_CACHE
# bunx wrangler kv namespace create AIRSCORE_CACHE --preview
[[kv_namespaces]]
binding = "AIRSCORE_CACHE"
id = "587aa70354de4a9c91df008af831c5a1"
preview_id = "824da1077c3b4299af9caab8a7d62ae3"

[vars]
AIRSCORE_BASE_URL = "https://xc.highcloud.net"
CACHE_TTL_TASK = "3600"
CACHE_TTL_TRACK = "86400"

# For local development, use a local KV store
[dev]
port = 8787
inspector_port = 9229

# Production route (uncomment and configure when deploying)
[[routes]]
pattern = "glidecomp.com/api/airscore/*"
zone_name = "glidecomp.com"
