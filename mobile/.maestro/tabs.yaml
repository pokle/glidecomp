# Stage 1: launch, the engine check, every tab, and the Submit sheet.
# Run on a booted simulator or emulator with the app installed:
#   bun run --cwd mobile e2e
appId: com.glidecomp.app.dev
---
- launchApp:
    clearState: true
# A clean start loads the whole development bundle again: a minute, on an
# emulator.
- extendedWaitUntil:
    visible: "Yours|Past"
    timeout: 60000
- takeScreenshot: comps

# The first tab tap after a cold launch can land before the tab bar takes
# touches; try again if nothing changed.
- tapOn:
    text: "My flights"
    retryTapIfNoChange: true
# Signed out it offers Sign in; signed in, the competition flights and the
# account's library (stage 6).
# (An iOS grouped list is a SwiftUI Form and exposes no testID of its own,
# so this asserts the screen's words.)
# Straight after a launch it says "Checking your sign-in…" until /api/auth/me
# answers, so wait rather than assert.
- extendedWaitUntil:
    visible: "Sign in to see your competition flights.*|Competition flights|Tracks|Tasks"
    timeout: 20000
- takeScreenshot: my-flights

- tapOn: "Me"
# The sign-in group, the sentence saying why a development build reading
# production cannot sign in there, or (signed in) the account's Sign out.
- assertVisible: "Email me a sign-in code|This development build reads glidecomp.com.*|Units"
- takeScreenshot: me

# The engine check moved to Me in stage 2.
- tapOn: "Engine check"
- extendedWaitUntil:
    visible: "Task distance 78.85 km"
    timeout: 20000
- assertVisible: "Jon Durand, 1000 points"
- assertVisible:
    id: "engine-check-times"
    text: "Start 15:30:00, ESS 17:07:55 \\(Australia/Melbourne\\)"
- runFlow: subflows/back.yaml

# Submit is an action: it presents a sheet over the current tab.
- tapOn: "Submit"
- extendedWaitUntil:
    visible: "Which task did you fly\\?"
    timeout: 15000
- takeScreenshot: submit-sheet
# Dismiss the way each platform does: system Back, or a swipe down.
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "50%, 45%"
          end: "50%, 98%"
# Back on Me, where the sheet was presented from.
- assertVisible: "Units"

- tapOn: "Comps"
- assertVisible: "Yours|Past"
