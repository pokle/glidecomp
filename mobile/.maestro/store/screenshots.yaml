# Store screenshots (stage 10, mobile/RELEASING.md). Not part of `bun run e2e`
# (a folder of its own): run `bun run screenshots` against each simulator the
# stores ask for, on a Release build reading production. Follows results.yaml
# through Corryong Cup 2026. The PNGs land in mobile/store/screenshots/
# (gitignored).
appId: com.glidecomp.app.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Past"
    timeout: 30000
- takeScreenshot: store/screenshots/1-comps
- scrollUntilVisible:
    element: "Corryong Cup 2026"
    timeout: 30000
- tapOn: "Corryong Cup 2026"
- extendedWaitUntil:
    visible: "Wing"
    timeout: 20000
- takeScreenshot: store/screenshots/2-comp
- scrollUntilVisible:
    element: "Scores"
- tapOn: "Scores"
- extendedWaitUntil:
    visible:
      id: "standing-row-.*"
    timeout: 30000
- takeScreenshot: store/screenshots/3-standings
- tapOn:
    id: "standing-row-.*"
    index: 0
- extendedWaitUntil:
    visible: "Place"
    timeout: 20000
- tapOn:
    id: "series-task-.*"
    index: 0
- extendedWaitUntil:
    visible: "The score"
    timeout: 30000
- takeScreenshot: store/screenshots/4-report-card
- scrollUntilVisible:
    element: "Track map"
- tapOn: "Track map"
- extendedWaitUntil:
    visible:
      id: "track-map"
    timeout: 30000
- takeScreenshot: store/screenshots/5-track-map
