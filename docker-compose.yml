# Local development environment for GlideComp.
#
# Usage:
#   docker compose up --build
#
# The frontend port defaults to 3000. Override it to run multiple
# worktrees side-by-side:
#   PORT=3001 docker compose up --build
#
# Mapbox token is read from your .env file (VITE_MAPBOX_TOKEN).
# Worker secrets are read from their .dev.vars files in the volume mount.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      # Every /api/* prefix goes to the dev-router Worker in the `workers`
      # container, which dispatches to auth / competition / airscore over
      # service bindings. See web/scripts/dev-workers.sh.
      DEV_API_ORIGIN: http://workers:8790
    command: >
      sh -c "bun install &&
             cd web/frontend &&
             exec bunx --bun vite --host 0.0.0.0 --port 3000"

  # All Cloudflare Workers run in ONE wrangler dev session (and so one
  # Miniflare instance) inside this container — service bindings resolve within
  # the session, and the shared D1 SQLite file has a single writer. Only the
  # primary config's port is exposed, which is the dev-router's; it dispatches
  # /api/* to the right Worker. See web/scripts/dev-workers.sh.
  workers:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8790:8790"  # dev-router → auth-api / competition-api / airscore-api
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["sh", "web/scripts/docker-dev-workers.sh"]

volumes:
  node_modules:
